<auth-base>
  <h3>Login</h3>
  <form id="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field>
      <input
        (keyup.enter)="onSubmit()"
        matInput
        type="email"
        placeholder="Email"
        formControlName="email"
      />
    </mat-form-field>
    <mat-form-field>
      <input
        (keyup.enter)="onSubmit()"
        matInput
        type="password"
        placeholder="Password"
        formControlName="password"
      />
    </mat-form-field>
    <p class="error" role="alert" *ngIf="error">{{ error }}</p>
    <button mat-raised-button color="primary" type="submit" [disabled]="busy">Submit</button>
  </form>
  <div class="demo">
    <span>or</span>
    <button mat-stroked-button color="accent" type="button" (click)="tryDemo()" [disabled]="busy">Try it without signing up</button>
  </div>
</auth-base>
